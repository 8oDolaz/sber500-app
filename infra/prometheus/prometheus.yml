global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9101"]}]
  - job_name: bot
    static_configs: [{targets: ["bot:9102"]}]
