# Local development: Postgres + Redis. Apps run on the host (`make dev`), or use the `full` profile.
name: kainem
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kainem
      POSTGRES_PASSWORD: kainem
      POSTGRES_DB: kainem
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kainem"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    profiles: [full]
    build: {context: ../backend}
    env_file: [../backend/.env]
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://kainem:kainem@postgres:5432/kainem
      REDIS_URL: redis://redis:6379/0
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-false}
    command: ["sh", "-c", "alembic upgrade head && uvicorn planner.entrypoints.api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    profiles: [full]
    build: {context: ../backend}
    env_file: [../backend/.env]
    environment: *backend-env
    command: ["python", "-m", "planner.entrypoints.worker"]
    depends_on: [api]
  bot:
    # Local only: long polling, so no public URL is needed. On a server the bot runs as a webhook in the API.
    profiles: [full]
    build: {context: ../backend}
    env_file: [../backend/.env]
    environment: *backend-env
    command: ["python", "-m", "planner.entrypoints.bot"]
    restart: unless-stopped
    depends_on: [api]
  web:
    profiles: [full]
    build: {context: ../frontend}
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]

  prometheus:
    profiles: [full]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]
  grafana:
    profiles: [full]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GRAFANA_PG_USER: ${GRAFANA_PG_USER:-kainem}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-kainem}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, postgres]

volumes:
  pgdata:
  grafana:
