# Single-VM deployment (staging / MVP production), e.g. a Russian cloud VM (152-FZ).
#   cp infra/.env.prod.example infra/.env.prod   # fill in secrets
#   docker compose -f infra/compose.prod.yml --env-file infra/.env.prod up -d --build
# Only Caddy is public (80/443). It also serves Grafana at https://$DOMAIN/grafana/ (sign-in required).
# Prometheus (and Grafana's own port) listen on 127.0.0.1: use an SSH tunnel.
# The bot long-polls Telegram through the xray proxy (ADR 0004); xray reads infra/xray/config.json.
name: kainem
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kainem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kainem
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kainem"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  api:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      ENABLE_TEST_ENDPOINTS: "false"
      APP_VERSION: ${APP_VERSION:-0.1.0}  # set by infra/deploy/deploy.sh: Sentry release, analytics app_version
    command: ["sh", "-c", "alembic upgrade head && uvicorn planner.entrypoints.api.app:create_app --factory --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      retries: 5
  worker:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["python", "-m", "planner.entrypoints.worker"]
    depends_on: {api: {condition: service_healthy}}
  bot:
    build: {context: ../backend}
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["python", "-m", "planner.entrypoints.bot"]
    depends_on: {api: {condition: service_healthy}, xray: {condition: service_started}}
  xray:
    # VLESS client: a SOCKS proxy on xray:1080, reachable only inside the compose network.
    image: ghcr.io/xtls/xray-core:26.3.27
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
  web:
    build:
      context: ../frontend
      args: {VITE_APP_VERSION: "${APP_VERSION:-0.1.0}"}
    restart: unless-stopped
    volumes:
      - ./nginx/real-ip.conf:/etc/nginx/conf.d/00-real-ip.conf:ro
    depends_on: [api]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      # The directory, not the file: deploy.sh reloads Caddy, and a file mount would keep the old inode after rsync.
      - ./caddy:/etc/caddy:ro
      - caddydata:/data
    depends_on: [web]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      # Public at https://$DOMAIN/grafana/ through Caddy. Invite links and redirects use this URL.
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      # Accounts only through the admin (Administration → Users → Invite); nothing visible without signing in.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_USER_INVITE_MAX_LIFETIME_DURATION: 72h
      GRAFANA_PG_USER: ${GRAFANA_PG_USER:-grafana_reader}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:?set GRAFANA_PG_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]  # SSH tunnel fallback: http://localhost:3000/grafana/

volumes:
  pgdata:
  redisdata:
  caddydata:
  promdata:
  grafanadata:
