# Production only (mounted by compose.prod.yml): nginx sits behind Caddy on the Docker network, so
# $remote_addr must be the client address Caddy reports, not Caddy's own. The web container publishes
# no ports in production, so only Caddy can reach it and set this header.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
