# Serves the PWA and proxies /api → backend on the same origin (session cookie stays first-party).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Prometheus scrapes the API inside the Docker network; never expose metrics publicly.
    location = /api/metrics { return 404; }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # Overwrite, never append: the API rate-limits by this address, so clients must not be able to set it.
        # (Behind a TLS proxy, configure set_real_ip_from for it so $remote_addr is the real client.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # The service worker and manifest must always be revalidated, or updates never ship.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / {
        try_files $uri /index.html;
    }
}
