[project]
name = "planner"
version = "0.1.0"
description = "kainem family planner — backend (API, bot, worker)"
authors = [
    { name = "8oDolaz1", email = "gzagranichnov@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "openai>=3.21.0",
    "procrastinate>=3.10.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres,redis]>=4.15.0",
]
loadtest = [
    "locust>=2.46.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intentional

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres/Redis (testcontainers, or TEST_DATABASE_URL/TEST_REDIS_URL)",
    "eval: calls the real LLM proxy and spends budget; never runs in CI by default",
]
addopts = "-m 'not eval'"

[tool.importlinter]
root_package = "planner"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints -> modules -> application -> domain"
type = "layers"
layers = [
    "planner.entrypoints",
    "planner.bootstrap",
    "planner.modules",
    "planner.application",
    "planner.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O frameworks"
type = "forbidden"
source_modules = ["planner.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "aiogram", "redis", "httpx", "openai", "procrastinate", "planner.infra"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Infra never depends on product modules or entrypoints"
type = "forbidden"
source_modules = ["planner.infra"]
forbidden_modules = ["planner.modules", "planner.entrypoints", "planner.bootstrap"]
ignore_imports = ["planner.infra.jobs -> planner.settings"]
