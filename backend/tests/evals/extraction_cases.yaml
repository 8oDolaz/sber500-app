# Golden set for message → tasks/events extraction (run: `uv run pytest -m eval -s`).
# reference = when the message was written (Europe/Moscow). expect: every item must be matched;
# kind "any" accepts task or event; omitted date/time are not checked. `expect: []` = nothing to plan.
# allow_extra: extra extracted items are fine (e.g. a list split into several tasks).

